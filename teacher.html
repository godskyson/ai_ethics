<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 윤리 수행평가 · 교사</title>
<meta name="description" content="AI 윤리 수행평가 교사용 대시보드">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef0eb">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/teacher.css">
</head>
<body>
<div class="save-state" id="netState" aria-live="polite"></div>

<!-- 교사 로그인 -->
<main id="loginView" class="login-view" hidden>
  <header>
    <h1>교사 화면</h1>
    <p>AI 윤리 수행평가 관리</p>
  </header>
  <section class="panel">
    <form id="loginForm" novalidate>
      <div class="field">
        <label class="field-label" for="email">이메일</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="field-label" for="password">비밀번호</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="msg" id="loginMsg" role="alert"></div>
      <div class="nav">
        <a class="small muted" href="./">학생 화면으로</a>
        <button type="submit" class="btn-primary" id="loginBtn">로그인</button>
      </div>
    </form>
  </section>
</main>

<!-- 대시보드 -->
<div id="appView" class="app" hidden>
  <header class="t-head">
    <div class="t-title">
      <h1>AI 윤리 수행평가</h1>
    </div>
    <div class="t-actions">
      <button type="button" class="btn-sm" id="accessLogBtn">접속 기록</button>
      <button type="button" class="btn-text" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <!-- 학급별 평가 제어: 학급마다 따로 시작·종료한다 -->
  <section class="class-bar" aria-label="평가 학급">
    <div class="class-pick">
      <label class="tool"><span>평가 학급</span>
        <select id="classSel"><option value="">전체 보기</option></select>
      </label>
      <span class="badge" id="statusBadge" hidden></span>
      <span class="small muted" id="examMeta"></span>
    </div>
    <div class="t-actions">
      <button type="button" class="btn-primary" id="startBtn">평가 시작</button>
      <button type="button" class="btn-danger" id="endBtn">평가 종료</button>
      <button type="button" id="resetExamBtn">다시 평가 준비</button>
    </div>
    <div class="class-chips" id="classChips" aria-label="학급별 상태"></div>
  </section>

  <section class="summary" id="summary" aria-label="요약"></section>

  <div class="tabs" role="tablist" aria-label="메뉴">
    <button role="tab" id="tabDash" aria-selected="true" aria-controls="dashView">대시보드</button>
    <button role="tab" id="tabRoster" aria-selected="false" aria-controls="rosterView">명단 관리</button>
    <button role="tab" id="tabResults" aria-selected="false" aria-controls="resultsView">결과 보기</button>
  </div>

  <section id="dashView" role="tabpanel" aria-labelledby="tabDash">
    <div class="toolbar">
      <label class="tool"><span>정렬</span>
        <select id="sortBy">
          <option value="sid">학번순</option>
          <option value="step">단계 낮은 순</option>
          <option value="away">이탈 많은 순</option>
        </select>
      </label>
      <label class="tool check"><input type="checkbox" id="awayOnly"> 지금 이탈 중인 학생만</label>
      <span class="small muted" id="shownCount"></span>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty-note" id="emptyNote" hidden>등록된 학생이 없어요. <b>명단 관리</b>에서 학생을 추가해 주세요.</p>
  </section>

  <section id="rosterView" role="tabpanel" aria-labelledby="tabRoster" hidden>
    <div class="roster-layout">
      <div class="panel roster-add">
        <h2>학생 추가</h2>
        <p class="sub small">학번은 5자리(학년 1 + 반 2 + 번호 2)예요. 이름은 저장하지 않아요. 새로 추가한 학생의 비밀번호는 <b>0000</b>이에요.</p>

        <div class="add-block">
          <h3>반 단위로 한꺼번에</h3>
          <div class="range-row">
            <label>학년 <select id="rGrade"><option>1</option><option>2</option><option>3</option></select></label>
            <label>반 <input type="number" id="rClass" min="1" max="19" value="1"></label>
            <label>번호 <input type="number" id="rFrom" min="1" max="49" value="1"></label>
            <span>~</span>
            <label class="sr-label"><span class="sr-only">끝 번호</span><input type="number" id="rTo" min="1" max="49" value="30"></label>
          </div>
          <p class="small muted" id="rangePreview"></p>
          <button type="button" class="btn-primary" id="rangeBtn">범위 추가</button>
        </div>

        <div class="add-block">
          <h3>붙여넣기로 추가</h3>
          <label class="field-label" for="pasteBox">학번 목록 (엑셀 열을 그대로 붙여넣어도 돼요)</label>
          <textarea id="pasteBox" placeholder="10101&#10;10102&#10;10103"></textarea>
          <div class="paste-preview" id="pastePreview"></div>
          <button type="button" class="btn-primary" id="pasteBtn" disabled>목록 추가</button>
        </div>

        <div class="add-block">
          <h3>한 명 추가</h3>
          <div class="test-row">
            <input type="text" id="oneSid" inputmode="numeric" maxlength="5" placeholder="예: 10101" aria-label="추가할 학번">
            <button type="button" id="oneBtn">추가</button>
          </div>
        </div>
        <div class="msg" id="rosterMsg" role="alert"></div>
      </div>

      <div class="panel roster-list">
        <div class="list-head">
          <h2>등록된 학생 <span class="muted" id="rosterCount"></span></h2>
        </div>
        <div id="rosterGroups"></div>
      </div>
    </div>
  </section>

  <section id="resultsView" role="tabpanel" aria-labelledby="tabResults" hidden>
    <div class="results-layout">
      <div class="panel result-list">
        <h2>평가 회차</h2>
        <p class="sub small">평가를 종료할 때 저장된 결과예요.</p>
        <ul class="exam-list" id="examList"></ul>
      </div>
      <div class="panel result-view" id="resultView">
        <p class="muted">왼쪽에서 회차를 고르세요.</p>
      </div>
    </div>
  </section>
</div>

<!-- 학생 상세 -->
<dialog class="modal detail" id="detail" aria-labelledby="detailTitle">
  <div class="modal-head detail-head">
    <h2 id="detailTitle"></h2>
    <button type="button" class="btn-sm" id="detailClose">닫기</button>
  </div>
  <div class="modal-body detail-body" id="detailBody"></div>
</dialog>

<!-- 교사 계정 접속 기록 -->
<dialog class="modal" id="accessLog" aria-labelledby="accessLogTitle">
  <div class="modal-head detail-head">
    <h2 id="accessLogTitle">교사 계정 접속 기록</h2>
    <button type="button" class="btn-sm" id="accessLogClose">닫기</button>
  </div>
  <div class="modal-body" id="accessLogBody"></div>
</dialog>

<script type="module" src="js/teacher.js"></script>
</body>
</html>
